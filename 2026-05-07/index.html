<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Магазин</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="products"></div>

<script>
  function createProductCard(image, title, rating, oldPrice, newPrice) {

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <img src="${image}" alt="">
        <div class="card-content">
            <div class="title">${title}</div>
            <div class="rating">${"⭐".repeat(rating)}</div>
            <div class="old-price">${oldPrice} грн</div>
            <div class="new-price">${newPrice} грн</div>
            <button class="buy-btn">Додати в кошик</button>
        </div>
    `;

    document.getElementById("products").appendChild(card);
  }

  for(let i = 1; i <= 25; i++){

    let rating = Math.floor(Math.random() * 5) + 1;
    let oldPrice = Math.floor(Math.random() * 5000) + 1000;
    let newPrice = oldPrice - Math.floor(Math.random() * 500);

    createProductCard(
      `https://picsum.photos/300/200?random=${i}`,
      `Товар №${i}`,
      rating,
      oldPrice,
      newPrice
    );
  }
</script>

</body>
</html>
